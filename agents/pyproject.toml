[project]
name = "mooring-agents"
version = "0.1.0"
description = "Mooring assistant LLM agents: berth map analysis, planning agent, safety sheet"
requires-python = ">=3.12"
dependencies = [
    "mooring-modeling",  # shared schemas and job/envelope helpers only; physics is called over HTTP
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
]

[tool.uv.sources]
mooring-modeling = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mooring_agents"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

