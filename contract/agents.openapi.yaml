          - type: 'null'
        sequence:
          items:
            $ref: '#/components/schemas/SequenceStep'
          type: array
          title: Sequence
        go_no_go:
          items:
            $ref: '#/components/schemas/GoNoGo'
          type: array
          title: Go No Go
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        rationale:
          items:
            $ref: '#/components/schemas/RationaleItem'
          type: array
          title: Rationale
        assumptions:
          items:
