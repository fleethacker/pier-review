        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        header:
          $ref: '#/components/schemas/SheetHeader'
        environment:
          $ref: '#/components/schemas/SheetEnvironment'
        line_plan:
          items:
            $ref: '#/components/schemas/SheetLineRow'
