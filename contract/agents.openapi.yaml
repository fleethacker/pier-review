      - locked
      - status
      - header
      - environment
      - line_plan
      - fitting_utilization
      - tug_plan
      - sequence
      - go_no_go
      - warnings
      - rationale
      - assumptions
      - cited_result_ids
      - sources
      - approvals
      - disclaimer
      title: SafetySheet
    SafetySheetCreate:
      properties:
        plan_id:
          type: string
          title: Plan Id
