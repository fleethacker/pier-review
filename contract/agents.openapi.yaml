openapi: 3.1.0
info:
  title: 'Mooring Assistant: Agents API'
  description: '

    LLM agent service for the mooring assistant. Typical flow: `POST /intake/reports` → `POST /agent/plans`

    (with `intake_report_id`) → `POST /safety/reviews` → `POST /safety-sheets` → approvals, with

    `GET /safety/watch/{plan_id}` for live gust warnings. Agents reach physics only through the Physics agent

    (`/tools`, `/physics/*`), which logs every call; every number in a plan cites a logged `result_id`.

    **Deterministic agents with optional guarded LLM layers.** Real implementation does not establish

    engineering qualification; inspect result validity and `/version` for module status.

    '
  version: 1.1.0
paths:
  /api/v1/intake/reports:
    post:
      tags:
      - Intake agent
      summary: Assess the environment for a berth (job; result is an IntakeReport)
      operationId: create_intake_report_api_v1_intake_reports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeRequest'
            examples:
              default:
                summary: Next 24 h for a saved scenario
                value:
                  scenario_id: <scenario_id from modeling POST /scenarios>
                  horizon_hours: 24
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake/reports/{report_id}:
    get:
      tags:
      - Intake agent
      summary: Get Intake Report
      operationId: get_intake_report_api_v1_intake_reports__report_id__get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tools:
    get:
      tags:
      - Physics agent
      summary: Physics tools agents may call
      operationId: tools_api_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ToolSpec'
                type: array
                title: Response Tools Api V1 Tools Get
  /api/v1/physics/tools/{tool_name}:
    post:
      tags:
      - Physics agent
      summary: Run one physics tool through the logged gateway
      operationId: run_tool_api_v1_physics_tools__tool_name__post
      parameters:
      - name: tool_name
        in: path
        required: true
        schema:
          type: string
          title: Tool Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolInvocation'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/physics/calls:
    get:
      tags:
      - Physics agent
      summary: Tool-call ledger, optionally for one plan
      operationId: list_calls_api_v1_physics_calls_get
      parameters:
      - name: plan_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolCall'
                title: Response List Calls Api V1 Physics Calls Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans:
    post:
      tags:
      - Planner agent
      summary: Start the planner on a saved scenario, optionally designing for an intake report
      operationId: create_plan_api_v1_agent_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlanRequest'
            examples:
              default:
                summary: Plan for a saved scenario
                value:
                  scenario_id: <scenario_id from modeling POST /scenarios>
                  intake_report_id: <optional report_id from POST /intake/reports>
                  objective: moor_for_forecast
                  target_margin_pct_wll: 80
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlanAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}:
    get:
      tags:
      - Planner agent
      summary: Get Plan
      operationId: get_plan_api_v1_agent_plans__plan_id__get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}/events:
    get:
      tags:
      - Planner agent
      summary: SSE computed step/proposal events and terminal done; follow=true includes subsequent answers.
      operationId: plan_events_api_v1_agent_plans__plan_id__events_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      - name: follow
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Follow
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}/messages:
    post:
      tags:
      - Planner agent
      summary: Ask a follow-up; the answer streams as a message event
      operationId: plan_message_api_v1_agent_plans__plan_id__messages_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessage'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/predictions/{result_id}/brief:
    get:
      tags:
      - Prediction agent
      summary: Explain a saved prediction, retaining its warnings, validity and unknown coverage
      operationId: prediction_brief_api_v1_predictions__result_id__brief_get
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          title: Result Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionBrief'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety/reviews:
    post:
      tags:
      - Safety agent
      summary: Independently review a finished plan (job; result is a SafetyReview)
      operationId: create_review_api_v1_safety_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyReviewRequest'
            examples:
              default:
                summary: Review a plan
                value:
                  plan_id: <plan_id>
                  intake_report_id: <optional report_id>
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety/reviews/{review_id}:
    get:
      tags:
      - Safety agent
      summary: Get Review
      operationId: get_review_api_v1_safety_reviews__review_id__get
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          title: Review Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyReview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety/watch/{plan_id}:
    get:
      tags:
      - Safety agent
      summary: SSE warnings and recheck notices; terminal source_unavailable on provider failure
      operationId: watch_api_v1_safety_watch__plan_id__get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      - name: interval_s
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 0
          default: 5.0
          title: Interval S
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 0
          default: 0
          title: Limit
      - name: heartbeat_minutes
        in: query
        required: false
        schema:
          type: number
          maximum: 1440
          minimum: 0
          default: 5.0
          title: Heartbeat Minutes
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets:
    post:
      tags:
      - Safety agent
      summary: Build a safety sheet from a reviewed plan (runs a review if none is given)
      operationId: create_sheet_api_v1_safety_sheets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetySheetCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheetCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}:
    get:
      tags:
      - Safety agent
      summary: Get Sheet
      operationId: get_sheet_api_v1_safety_sheets__sheet_id__get
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}/render:
    get:
      tags:
      - Safety agent
      summary: Render the printable sheet as HTML or PDF.
      operationId: render_sheet_api_v1_safety_sheets__sheet_id__render_get
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: html
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}/approvals:
    post:
      tags:
      - Safety agent
      summary: Record an approval or rejection; the sheet locks on the first one
      operationId: approve_sheet_api_v1_safety_sheets__sheet_id__approvals_post
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreate'
            examples:
              default:
                summary: CO approval
                value:
                  role: co
                  name: Commanding Officer
                  decision: approve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/berth-vision/analyze:
    post:
      tags:
      - Berth map agent
      summary: 'Analyze a berth image (multipart: image + metadata JSON). Job result is a VisionResponse.'
      operationId: vision_analyze_api_v1_berth_vision_analyze_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_vision_analyze_api_v1_berth_vision_analyze_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/berth-vision/{job_id}/confirm:
    post:
      tags:
      - Berth map agent
      summary: Save the human-confirmed berth to the modeling service
      operationId: vision_confirm_api_v1_berth_vision__job_id__confirm_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionConfirm'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BerthCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - System
      summary: Job Status
      operationId: job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - System
      summary: Cancel Job
      operationId: cancel_job_api_v1_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/events:
    get:
      tags:
      - System
      summary: Job Events
      operationId: job_events_api_v1_jobs__job_id__events_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/version:
    get:
      tags:
      - System
      summary: Version
      operationId: version_api_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
components:
  schemas:
    AgentMessage:
      properties:
        text:
          type: string
          title: Text
          examples:
          - What if the wind backs to NW at 35 kt?
      additionalProperties: false
      type: object
      required:
      - text
      title: AgentMessage
    AgentMessageAccepted:
      properties:
        message_id:
          type: string
          title: Message Id
      additionalProperties: false
      type: object
      required:
      - message_id
      title: AgentMessageAccepted
    AgentPlan:
      properties:
        forecast_manifest:
          anyOf:
          - $ref: '#/components/schemas/ForecastResolutionManifest'
          - type: 'null'
        forecast_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Forecast Result Id
        forecast_request:
          anyOf:
          - $ref: '#/components/schemas/ForecastResolveRequest'
          - type: 'null'
        plan_id:
          type: string
          title: Plan Id
        scenario_id:
          type: string
          title: Scenario Id
        intake_report_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Intake Report Id
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: State
        status:
          anyOf:
          - type: string
            enum:
            - GREEN
            - AMBER
            - RED
          - type: 'null'
          title: Status
        config:
          anyOf:
          - $ref: '#/components/schemas/MooringConfig'
          - type: 'null'
        tug_plan:
          anyOf:
          - $ref: '#/components/schemas/TugPlanResult'
          - type: 'null'
        sequence:
          anyOf:
          - $ref: '#/components/schemas/SequenceResult'
          - type: 'null'
        sequence_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sequence Result Id
        installed_at_water_level_mllw_ft:
          anyOf:
          - type: number
          - type: 'null'
          title: Installed At Water Level Mllw Ft
          description: Common line-installation tide used across assessed conditions; absent on legacy plans.
        analysis_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis Result Id
        risk_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Result Id
        rationale:
          items:
            $ref: '#/components/schemas/RationaleItem'
          type: array
          title: Rationale
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        open_questions:
          items:
            type: string
          type: array
          title: Open Questions
        safety_sheet_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Safety Sheet Id
        holding_tugs:
          items:
            $ref: '#/components/schemas/TugAssignment'
          type: array
          title: Holding Tugs
          description: Assistance included in final analyses.
        condition_analysis_result_ids:
          items:
            type: string
          type: array
          title: Condition Analysis Result Ids
          description: Final analysis for each required condition.
      additionalProperties: false
      type: object
      required:
      - plan_id
      - scenario_id
      - state
      title: AgentPlan
    AgentPlanAccepted:
      properties:
        plan_id:
          type: string
          title: Plan Id
        job_id:
          type: string
          title: Job Id
        events_url:
          type: string
          title: Events Url
      additionalProperties: false
      type: object
      required:
      - plan_id
      - job_id
      - events_url
      title: AgentPlanAccepted
    AgentPlanRequest:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
        intake_report_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Intake Report Id
          description: Evaluate every planning condition in this report.
        objective:
          type: string
          enum:
          - moor_for_forecast
          - berthing
          - storm_prep
          title: Objective
          default: moor_for_forecast
        target_margin_pct_wll:
          type: number
          maximum: 100.0
          exclusiveMinimum: 0.0
          title: Target Margin Pct Wll
          description: Plan is GREEN only below this.
          default: 80
        max_iterations:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Max Iterations
          default: 8
        constraints:
          additionalProperties: true
          type: object
          title: Constraints
      additionalProperties: false
      type: object
      required:
      - scenario_id
      title: AgentPlanRequest
    Approval:
      properties:
        role:
          type: string
          enum:
          - pilot
          - first_lt
          - co
          title: Role
        name:
          type: string
          title: Name
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        at_utc:
          type: string
          format: date-time
          title: At Utc
      additionalProperties: false
      type: object
      required:
      - role
      - name
      - decision
      - at_utc
      title: Approval
    ApprovalCreate:
      properties:
        role:
          type: string
          enum:
          - pilot
          - first_lt
          - co
          title: Role
        name:
          type: string
          title: Name
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      additionalProperties: false
      type: object
      required:
      - role
      - name
      - decision
      title: ApprovalCreate
    Berth:
      properties:
        berth_id:
          type: string
          title: Berth Id
          examples:
          - NAVSTA-NORFOLK-P12-N
        name:
          type: string
          title: Name
        face_bearing_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Face Bearing True Deg
          description: True bearing of the berth frame's +x axis.
        origin_lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Origin Lat
        origin_lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Origin Lon
        face_length_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Face Length Ft
        deck_height_mllw_ft:
          type: number
          title: Deck Height Mllw Ft
        depth_profile:
          items:
            $ref: '#/components/schemas/DepthPoint'
          type: array
          minItems: 1
          title: Depth Profile
          description: At least one MLLW depth sample; x_ft stations must be unique. Input ordering is unrestricted.
        fittings:
          items:
