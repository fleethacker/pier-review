    MooringLine:
      properties:
        line_number:
          type: integer
          minimum: 1.0
          title: Line Number
        role:
          anyOf:
          - type: string
            enum:
            - bow
            - breast
            - spring_fwd
            - spring_aft
            - stern
          - type: 'null'
          title: Role
          description: Computed from geometry when omitted. spring_fwd leads forward (stops the ship moving aft).
        spec_id:
          type: string
          title: Spec Id
          examples:
          - NYLON-DB-7IN
        parts:
          type: integer
          enum:
          - 1
          - 2
          - 3
          title: Parts
          description: 1 = single, 2 = tanker moor, 3 = doubled up.
          default: 1
        ship_fitting_id:
          type: string
          title: Ship Fitting Id
          examples:
          - BITT-1S
        chock_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chock Id
          description: Defaults to the bitt's paired chock.
        pier_fitting_id:
          type: string
          title: Pier Fitting Id
          examples:
          - P12N-B16
        pretension_lbf:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Pretension Lbf
          description: 'Initial tension. Legacy default when omitted: 2% of effective MBS (0 if slack_ft > 0). Mutually exclusive
            with a positive slack_ft: a slack line carries no tension.'
        slack_ft:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Slack Ft
          description: Extra line length beyond the straight-line distance, in feet of stretched length.
        paid_out_unstretched_length_ft:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Paid Out Unstretched Length Ft
          description: Unstretched length paid out between fittings. Used directly as the installed rest length by the M4
            equilibrium solver. Cannot be combined with slack_ft or pretension_lbf.
        condition:
          anyOf:
