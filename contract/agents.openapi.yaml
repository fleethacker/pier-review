    Validity:
      properties:
        state:
          type: string
          enum:
          - valid
          - limited
          - invalid
          - unknown
          title: State
        reasons:
          items:
            $ref: '#/components/schemas/ValidityReason'
          type: array
          title: Reasons
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/SolverDiagnostics'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
