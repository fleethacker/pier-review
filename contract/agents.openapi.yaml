          description: Two or more known points.
          title: Points
        scale_ft_per_px:
          anyOf:
          - exclusiveMinimum: 0
            type: number
          - type: 'null'
          default: null
          title: Scale Ft Per Px
      title: Georef
      type: object
    GeorefPoint:
      additionalProperties: false
      properties:
        px:
          description: Pixel [x, y] in the uploaded image.
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          title: Px
          type: array
        lat:
          title: Lat
          type: number
        lon:
          title: Lon
          type: number
      required:
      - px
      - lat
      - lon
      title: GeorefPoint
      type: object
    GustWarning:
      additionalProperties: false
      description: SSE `warning` event on GET /safety/watch/{plan_id}.
      properties:
        requires_recheck:
          default: false
          title: Requires Recheck
          type: boolean
        recheck_reasons:
          items:
            type: string
          title: Recheck Reasons
          type: array
        warning_id:
          title: Warning Id
          type: string
        plan_id:
          title: Plan Id
          type: string
        at_utc:
          format: date-time
          title: At Utc
          type: string
        severity:
          enum:
          - INFO
          - AMBER
          - RED
          title: Severity
          type: string
        gust_kt:
          title: Gust Kt
          type: number
        wind_from_true_deg:
          title: Wind From True Deg
          type: number
        pct_of_wll_limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Pct Of Wll Limit
        pct_of_breaking_limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Pct Of Breaking Limit
        element_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Element Id
        message:
          title: Message
          type: string
      required:
      - warning_id
      - plan_id
      - at_utc
      - severity
      - gust_kt
      - wind_from_true_deg
      - pct_of_wll_limit
      - pct_of_breaking_limit
      - element_id
      - message
      title: GustWarning
      type: object
    SafetyWatchUnavailable:
      additionalProperties: false
      description: Terminal SSE source_unavailable event; contains no fabricated measurement.
      properties:
        plan_id:
          title: Plan Id
          type: string
        at_utc:
          format: date-time
          title: At Utc
          type: string
        severity:
          const: RED
          default: RED
          title: Severity
          type: string
        reason:
          title: Reason
          type: string
        retryable:
          title: Retryable
          type: boolean
      required:
      - plan_id
      - at_utc
      - reason
      - retryable
      title: SafetyWatchUnavailable
      type: object
    VisionMetadata:
      additionalProperties: false
      description: Sent as the `metadata` form field (a JSON string) next to the `image` file.
      properties:
        berth_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Catalog berth supplying surveyed face location and notional fittings; absent uses an explicitly labeled
            demo template.
          title: Berth Id
        pier_face_start_px:
          anyOf:
          - maxItems: 2
            minItems: 2
            prefixItems:
            - type: number
            - type: number
            type: array
          - type: 'null'
          default: null
          title: Pier Face Start Px
        pier_face_end_px:
          anyOf:
          - maxItems: 2
            minItems: 2
            prefixItems:
            - type: number
            - type: number
            type: array
          - type: 'null'
          default: null
          title: Pier Face End Px
        image_kind:
          enum:
          - satellite
          - chart
          - berthing_plan
          - photo
          title: Image Kind
          type: string
        georef:
          anyOf:
          - $ref: '#/components/schemas/Georef'
          - type: 'null'
          default: null
        berth_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Berth Name
        ship_class_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Ship Class Id
        side_to:
          anyOf:
          - enum:
            - port
            - starboard
            type: string
          - type: 'null'
          default: null
          title: Side To
      required:
      - image_kind
      title: VisionMetadata
      type: object
    VisionResponse:
      additionalProperties: false
      properties:
        result_id:
          description: Stable id; the agent and safety sheet cite numbers by this id.
          title: Result Id
          type: string
        model:
          description: Module that produced the result, e.g. 'mooring.solver.static'.
          title: Model
          type: string
        model_version:
          title: Model Version
          type: string
        backend:
          description: '''mock'' until the workstream''s real module lands.'
          enum:
          - mock
          - real
          title: Backend
          type: string
        inputs_hash:
          description: sha256 of the canonical request JSON.
          title: Inputs Hash
          type: string
        computed_at_utc:
          format: date-time
          title: Computed At Utc
          type: string
        status:
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
          type: string
        assumptions:
          items:
            type: string
          title: Assumptions
          type: array
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          title: Warnings
          type: array
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          default: null
          description: Omitted when unset; absence means UNKNOWN, never valid. New real paths always populate it. 'invalid'
            requires status RED; 'limited' cannot be GREEN.
        manifest:
          anyOf:
          - $ref: '#/components/schemas/ResultManifest'
          - type: 'null'
          default: null
          description: Dependencies for reproducing the result; omitted when unset to preserve legacy response shapes.
        result:
          $ref: '#/components/schemas/VisionResult'
      required:
      - result_id
      - model
      - model_version
      - backend
      - inputs_hash
      - computed_at_utc
      - status
      - result
      title: VisionResponse
      type: object
    VisionResult:
      additionalProperties: false
      properties:
        recommendation_result_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Recommendation Result Id
        extraction_source:
          anyOf:
          - enum:
            - deterministic
            - llm
            - detector
            type: string
          - type: 'null'
          default: null
          title: Extraction Source
        extraction_note:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Extraction Note
        geometry_result_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Geometry Result Id
        image_sha256:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Image Sha256
        draft_berth:
          $ref: '#/components/schemas/Berth'
        detections:
          items:
            $ref: '#/components/schemas/Detection'
          title: Detections
          type: array
        recommended_config:
          anyOf:
          - $ref: '#/components/schemas/MooringConfig'
          - type: 'null'
        questions:
          items:
            type: string
          title: Questions
          type: array
      required:
      - draft_berth
      - detections
      - recommended_config
      - questions
      title: VisionResult
      type: object
tags:
- name: Intake agent
  description: Environment data -> windows of concern, MST assessment, design conditions.
- name: Physics agent
  description: 'Logged gateway to modeling tools. No LLM, no math: modeling computes.'
- name: Planner agent
  description: Plan, evaluate, adjust loop over physics tools; streams progress.
- name: Safety agent
  description: Independent review, live gust warnings, Mooring Evolution Safety Sheet.
- name: Berth map agent
  description: Image of a berth -> draft berth and line placement, human-confirmed.
- name: Prediction agent
  description: Cited narration of immutable modeling predictions; no new physics or hazard decisions.
- name: System
  description: Jobs, health.
servers:
- url: http://localhost:8001
  description: Local agents service
