openapi: 3.1.0
info:
  title: 'Mooring Assistant: Agents API'
  description: '

    LLM agent service for the mooring assistant. Agents reach physics only through the modeling API

    (`contract/modeling.openapi.yaml`) and cite every number by `result_id`. **All agents currently run as mocks**

    (deterministic, no LLM). Plan progress streams as Server-Sent Events: `step`, `proposal`, `message`, `done`.

    '
  version: 1.0.0
paths:
  /api/v1/berth-vision/analyze:
    post:
      tags:
      - M8 Berth vision
      summary: 'Analyze a berth image (multipart: image + metadata JSON). Job result is a VisionResponse.'
      operationId: vision_analyze_api_v1_berth_vision_analyze_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_vision_analyze_api_v1_berth_vision_analyze_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/berth-vision/{job_id}/confirm:
    post:
      tags:
      - M8 Berth vision
      summary: Save the human-confirmed berth to the modeling service
      operationId: vision_confirm_api_v1_berth_vision__job_id__confirm_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionConfirm'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BerthCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans:
    post:
      tags:
      - M9 Planning agent
      summary: Start the planning agent on a saved scenario
      operationId: create_plan_api_v1_agent_plans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPlanRequest'
            examples:
              default:
                summary: Plan for a saved scenario
                value:
                  scenario_id: <scenario_id from modeling POST /scenarios>
                  objective: moor_for_forecast
                  target_margin_pct_wll: 80
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlanAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}:
    get:
      tags:
      - M9 Planning agent
      summary: Get Plan
      operationId: get_plan_api_v1_agent_plans__plan_id__get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}/events:
    get:
      tags:
      - M9 Planning agent
      summary: 'SSE: step (AgentStepEvent), proposal (AgentProposalEvent), message (AgentMessageEvent), done (AgentDoneEvent).
        follow=true keeps the stream open for follow-up answers.'
      operationId: plan_events_api_v1_agent_plans__plan_id__events_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      - name: follow
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Follow
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/plans/{plan_id}/messages:
    post:
      tags:
      - M9 Planning agent
      summary: Ask a follow-up; the answer streams as a `message` event
      operationId: plan_message_api_v1_agent_plans__plan_id__messages_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessage'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets:
    post:
      tags:
      - M10 Safety sheet
      summary: Build a safety sheet from a finished plan
      operationId: create_sheet_api_v1_safety_sheets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetySheetCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheetCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}:
    get:
      tags:
      - M10 Safety sheet
      summary: Get Sheet
      operationId: get_sheet_api_v1_safety_sheets__sheet_id__get
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}/render:
    get:
      tags:
      - M10 Safety sheet
      summary: Printable sheet. format=html now; pdf returns 501 until the renderer lands.
      operationId: render_sheet_api_v1_safety_sheets__sheet_id__render_get
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: html
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/safety-sheets/{sheet_id}/approvals:
    post:
      tags:
      - M10 Safety sheet
      summary: Record an approval or rejection; the sheet locks on the first one
      operationId: approve_sheet_api_v1_safety_sheets__sheet_id__approvals_post
      parameters:
      - name: sheet_id
        in: path
        required: true
        schema:
          type: string
          title: Sheet Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreate'
            examples:
              default:
                summary: CO approval
                value:
                  role: co
                  name: Commanding Officer
                  decision: approve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySheet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - System
      summary: Job Status
      operationId: job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/events:
    get:
      tags:
      - System
      summary: Job Events
      operationId: job_events_api_v1_jobs__job_id__events_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tools:
    get:
      tags:
      - System
      summary: Modeling tools the agents may call
      operationId: tools_api_v1_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ToolSpec'
                type: array
                title: Response Tools Api V1 Tools Get
  /api/v1/health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/version:
    get:
      tags:
      - System
      summary: Version
      operationId: version_api_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
components:
  schemas:
    AgentMessage:
      properties:
        text:
          type: string
          title: Text
          examples:
          - What if the wind backs to NW at 35 kt?
      additionalProperties: false
      type: object
      required:
      - text
      title: AgentMessage
    AgentMessageAccepted:
      properties:
        message_id:
          type: string
          title: Message Id
      additionalProperties: false
      type: object
      required:
      - message_id
      title: AgentMessageAccepted
    AgentPlan:
      properties:
        plan_id:
          type: string
          title: Plan Id
        scenario_id:
          type: string
          title: Scenario Id
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: State
        status:
          anyOf:
          - type: string
            enum:
            - GREEN
            - AMBER
            - RED
          - type: 'null'
          title: Status
        config:
          anyOf:
          - $ref: '#/components/schemas/MooringConfig'
          - type: 'null'
        tug_plan:
          anyOf:
          - $ref: '#/components/schemas/TugPlanResult'
          - type: 'null'
        sequence:
          anyOf:
          - $ref: '#/components/schemas/SequenceResult'
          - type: 'null'
        analysis_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis Result Id
        risk_result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Result Id
        rationale:
          items:
            $ref: '#/components/schemas/RationaleItem'
          type: array
          title: Rationale
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        open_questions:
          items:
            type: string
          type: array
          title: Open Questions
        safety_sheet_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Safety Sheet Id
      additionalProperties: false
      type: object
      required:
      - plan_id
      - scenario_id
      - state
      title: AgentPlan
    AgentPlanAccepted:
      properties:
        plan_id:
          type: string
          title: Plan Id
        job_id:
          type: string
          title: Job Id
        events_url:
          type: string
          title: Events Url
      additionalProperties: false
      type: object
      required:
      - plan_id
      - job_id
      - events_url
      title: AgentPlanAccepted
    AgentPlanRequest:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
        objective:
          type: string
          enum:
          - moor_for_forecast
          - berthing
          - storm_prep
          title: Objective
          default: moor_for_forecast
        target_margin_pct_wll:
          type: number
          maximum: 100.0
          exclusiveMinimum: 0.0
          title: Target Margin Pct Wll
          description: Plan is GREEN only below this.
          default: 80
        max_iterations:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Max Iterations
          default: 8
        constraints:
          additionalProperties: true
          type: object
          title: Constraints
      additionalProperties: false
      type: object
      required:
      - scenario_id
      title: AgentPlanRequest
    Approval:
      properties:
        role:
          type: string
          enum:
          - pilot
          - first_lt
          - co
          title: Role
        name:
          type: string
          title: Name
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        at_utc:
          type: string
          format: date-time
          title: At Utc
      additionalProperties: false
      type: object
      required:
      - role
      - name
      - decision
      - at_utc
      title: Approval
    ApprovalCreate:
      properties:
        role:
          type: string
          enum:
          - pilot
          - first_lt
          - co
          title: Role
        name:
          type: string
          title: Name
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      additionalProperties: false
      type: object
      required:
      - role
      - name
      - decision
      title: ApprovalCreate
    Berth:
      properties:
        berth_id:
          type: string
          title: Berth Id
          examples:
          - NAVSTA-NORFOLK-P12-N
        name:
          type: string
          title: Name
        face_bearing_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Face Bearing True Deg
          description: True bearing of the berth frame's +x axis.
        origin_lat:
          type: number
          title: Origin Lat
        origin_lon:
          type: number
          title: Origin Lon
        face_length_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Face Length Ft
        deck_height_mllw_ft:
          type: number
          title: Deck Height Mllw Ft
        depth_profile:
          items:
            $ref: '#/components/schemas/DepthPoint'
          type: array
          title: Depth Profile
        fittings:
          items:
            $ref: '#/components/schemas/PierFitting'
          type: array
          title: Fittings
        fenders:
          items:
            $ref: '#/components/schemas/Fender'
          type: array
          title: Fenders
        structure:
          type: string
          enum:
          - open_pile
          - solid
          title: Structure
          default: open_pile
        env_station_ids:
          $ref: '#/components/schemas/EnvStations'
        provenance:
          $ref: '#/components/schemas/Provenance'
      additionalProperties: false
      type: object
      required:
      - berth_id
      - name
      - face_bearing_true_deg
      - origin_lat
      - origin_lon
      - face_length_ft
      - deck_height_mllw_ft
      - depth_profile
      - fittings
      - env_station_ids
      - provenance
      title: Berth
    BerthCreated:
      properties:
        berth_id:
          type: string
          title: Berth Id
      additionalProperties: false
      type: object
      required:
      - berth_id
      title: BerthCreated
    Body_vision_analyze_api_v1_berth_vision_analyze_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: PNG, JPEG or PDF page
        metadata:
          type: string
          title: Metadata
          description: 'VisionMetadata as JSON, e.g. {"image_kind": "satellite", "georef": {"scale_ft_per_px": 0.5}, "ship_class_id":
            "DDG-51-FIIA", "side_to": "starboard"}'
      type: object
      required:
      - image
      - metadata
      title: Body_vision_analyze_api_v1_berth_vision_analyze_post
    DepthPoint:
      properties:
        x_ft:
          type: number
          title: X Ft
        depth_mllw_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Depth Mllw Ft
      additionalProperties: false
      type: object
      required:
      - x_ft
      - depth_mllw_ft
      title: DepthPoint
    EnvStations:
      properties:
        wind:
          type: string
          title: Wind
          examples:
          - '8638614'
        current:
          type: string
          title: Current
          examples:
          - cb0402
        water_level:
          type: string
          title: Water Level
          examples:
          - '8638610'
      additionalProperties: false
      type: object
      required:
      - wind
      - current
      - water_level
      title: EnvStations
      description: NOAA CO-OPS station ids that feed this berth's environment.
    EnvironmentSnapshot:
      properties:
        valid_at_utc:
          type: string
          format: date-time
          title: Valid At Utc
        source:
          type: string
          enum:
          - live
          - replay
          - forecast
          - scenario
          - ship_sensor
          - mock
          title: Source
          default: scenario
        wind_speed_kt:
          type: number
          minimum: 0.0
          title: Wind Speed Kt
          description: Sustained wind, 10 m height, 1-minute average.
        wind_gust_kt:
          type: number
          minimum: 0.0
          title: Wind Gust Kt
        wind_from_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Wind From True Deg
          description: Direction the wind blows FROM.
        current_speed_kt:
          type: number
          minimum: 0.0
          title: Current Speed Kt
        current_set_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Current Set True Deg
          description: Direction the current flows TOWARD.
        water_level_mllw_ft:
          type: number
          title: Water Level Mllw Ft
        tide_stage:
          anyOf:
          - type: string
            enum:
            - flood
            - ebb
            - slack
          - type: 'null'
          title: Tide Stage
        air_density_kgm3:
          type: number
          exclusiveMinimum: 0.0
          title: Air Density Kgm3
          default: 1.225
        water_density_kgm3:
          type: number
          exclusiveMinimum: 0.0
          title: Water Density Kgm3
          description: Brackish Chesapeake default.
          default: 1020.0
        wind_rel_ship_deg:
          anyOf:
          - type: number
          - type: 'null'
          title: Wind Rel Ship Deg
          description: Relative bearing the wind comes from (0 = bow, 90 = starboard beam).
        current_rel_ship_deg:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Rel Ship Deg
          description: Relative bearing the current flows toward (0 = bow, 90 = starboard beam).
        quality:
          items:
            $ref: '#/components/schemas/StationQuality'
          type: array
          title: Quality
      additionalProperties: false
      type: object
      required:
      - wind_speed_kt
      - wind_gust_kt
      - wind_from_true_deg
      - current_speed_kt
      - current_set_true_deg
      - water_level_mllw_ft
      title: EnvironmentSnapshot
      description: Wind, current and water level at one time. Wind is normalized to a 10 m, 1-minute sustained speed.
    Fender:
      properties:
        fender_id:
          type: string
          title: Fender Id
        kind:
          type: string
          enum:
          - camel
          - pneumatic
          - foam
          - separator
          title: Kind
        x_ft:
          type: number
          title: X Ft
        length_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Length Ft
        standoff_ft:
          type: number
          minimum: 0.0
          title: Standoff Ft
          description: Distance from pier face to the ship's side.
        stiffness_lbf_per_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Stiffness Lbf Per Ft
        rated_energy_ftlbf:
          type: number
          exclusiveMinimum: 0.0
          title: Rated Energy Ftlbf
      additionalProperties: false
      type: object
      required:
      - fender_id
      - kind
      - x_ft
      - length_ft
      - standoff_ft
      - stiffness_lbf_per_ft
      - rated_energy_ftlbf
      title: Fender
      description: Camel, separator or fender along the face. x in the berth frame.
    Finding:
      properties:
        rule_id:
          type: string
          title: Rule Id
          examples:
          - LINE-WLL
        severity:
          type: string
          enum:
          - INFO
          - AMBER
          - RED
          title: Severity
        element_ids:
          items:
            type: string
          type: array
          title: Element Ids
          examples:
          - - line-2
        message:
          type: string
          title: Message
        reference:
          type: string
          title: Reference
          description: NSTM 582 paragraph or table the rule implements.
      additionalProperties: false
      type: object
      required:
      - rule_id
      - severity
      - message
      - reference
      title: Finding
      description: One rule result from the NSTM 582 rule registry (see GET /rules).
    GoNoGo:
      properties:
        condition:
          type: string
          title: Condition
          examples:
          - Sustained wind above 30 kt
        action:
          type: string
          title: Action
          examples:
          - Double up lines 2 and 5
      additionalProperties: false
      type: object
      required:
      - condition
      - action
      title: GoNoGo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        backend:
          type: string
          enum:
          - mock
          - real
          - mixed
          title: Backend
      additionalProperties: false
      type: object
      required:
      - status
      - backend
      title: Health
    JobAccepted:
      properties:
        job_id:
          type: string
          title: Job Id
        kind:
          type: string
          title: Kind
          description: Endpoint family, e.g. 'risk.exceedance'.
        status_url:
          type: string
          title: Status Url
        events_url:
          type: string
          title: Events Url
          description: Server-Sent Events stream of progress for this job.
      additionalProperties: false
      type: object
      required:
      - job_id
      - kind
      - status_url
      - events_url
      title: JobAccepted
      description: Returned with HTTP 202 by every long-running endpoint.
    JobStatus:
      properties:
        job_id:
          type: string
          title: Job Id
        kind:
          type: string
          title: Kind
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: State
        progress:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Progress
        created_at_utc:
          type: string
          format: date-time
          title: Created At Utc
        finished_at_utc:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At Utc
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
          description: The module's response envelope once state is 'succeeded'.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      additionalProperties: false
      type: object
      required:
      - job_id
      - kind
      - state
      - progress
      - created_at_utc
      title: JobStatus
    MooringConfig:
      properties:
        config_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Id
        side_to:
          type: string
          enum:
          - port
          - starboard
          title: Side To
        ship_x_ft:
          type: number
          title: Ship X Ft
          description: Berth-frame x of the ship's midships.
        standoff_ft:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Standoff Ft
          description: Defaults to the berth's camel standoff.
        lines:
          items:
            $ref: '#/components/schemas/MooringLine'
          type: array
          title: Lines
      additionalProperties: false
      type: object
      required:
      - side_to
      - ship_x_ft
      - lines
      title: MooringConfig
    MooringLine:
      properties:
        line_number:
          type: integer
          minimum: 1.0
          title: Line Number
        role:
          anyOf:
          - type: string
            enum:
            - bow
            - breast
            - spring_fwd
            - spring_aft
            - stern
          - type: 'null'
          title: Role
          description: Computed from geometry when omitted. spring_fwd leads forward (stops the ship moving aft).
        spec_id:
          type: string
          title: Spec Id
          examples:
          - NYLON-DB-7IN
        parts:
          type: integer
          enum:
          - 1
          - 2
          - 3
          title: Parts
          description: 1 = single, 2 = tanker moor, 3 = doubled up.
          default: 1
        ship_fitting_id:
          type: string
          title: Ship Fitting Id
          examples:
          - BITT-1S
        chock_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chock Id
          description: Defaults to the bitt's paired chock.
        pier_fitting_id:
          type: string
          title: Pier Fitting Id
          examples:
          - P12N-B16
        pretension_lbf:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Pretension Lbf
        slack_ft:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Slack Ft
      additionalProperties: false
      type: object
      required:
      - line_number
      - spec_id
      - ship_fitting_id
      - pier_fitting_id
      title: MooringLine
      description: One mooring line. Lines are numbered forward to aft (NSTM 582-4.2.1).
    PierFitting:
      properties:
        fitting_id:
          type: string
          title: Fitting Id
          examples:
          - P12N-B12
        kind:
          type: string
          enum:
          - bollard_special_a
          - bollard_special_b
          - bollard_horn
          - double_bitt_lip
          - low_double_bitt
          - cleat_42
          - cleat_30
          title: Kind
        x_ft:
          type: number
          title: X Ft
        y_ft:
          type: number
          title: Y Ft
        capacity_nominal_lbf:
          type: number
          exclusiveMinimum: 0.0
          title: Capacity Nominal Lbf
          description: Working capacity (NSTM Table 582-5-6, 'Nom.').
        capacity_horizontal_lbf:
          anyOf:
          - type: number
          - type: 'null'
          title: Capacity Horizontal Lbf
        capacity_45deg_lbf:
          anyOf:
          - type: number
          - type: 'null'
          title: Capacity 45Deg Lbf
        condition:
          type: string
          enum:
          - good
          - suspect
          - do_not_use
          title: Condition
          default: good
        occupied_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Occupied By
          description: Another ship's line already on this fitting.
      additionalProperties: false
      type: object
      required:
      - fitting_id
      - kind
      - x_ft
      - y_ft
      - capacity_nominal_lbf
      title: PierFitting
      description: A bollard, bitt or cleat on the pier. Coordinates in the berth frame (negative y = on the deck).
    PierFittingResult:
      properties:
        fitting_id:
          type: string
          title: Fitting Id
        load_lbf:
          type: number
          title: Load Lbf
        capacity_lbf:
          type: number
          title: Capacity Lbf
        pct:
          type: number
          title: Pct
        lines:
          items:
            type: integer
          type: array
          title: Lines
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
      additionalProperties: false
      type: object
      required:
      - fitting_id
      - load_lbf
      - capacity_lbf
      - pct
      - lines
      - status
      title: PierFittingResult
    Provenance:
      properties:
        source:
          type: string
          title: Source
          description: Human-readable source, e.g. 'NSTM 582 Table 582-5-6' or 'mock seed data'.
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        confidence:
          type: string
          enum:
          - published
          - estimated
          - mock
          - vision
          title: Confidence
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - source
      - confidence
      title: Provenance
      description: Where a value came from, so the UI and safety sheet can show how much to trust it.
    PushPointForce:
      properties:
        push_point_id:
          type: string
          title: Push Point Id
        force_lbf:
          type: number
          title: Force Lbf
        mode:
          type: string
          enum:
          - push
          - pull
          title: Mode
      additionalProperties: false
      type: object
      required:
      - push_point_id
      - force_lbf
      - mode
      title: PushPointForce
    RationaleItem:
      properties:
        text:
          type: string
          title: Text
        cites:
          items:
            type: string
          type: array
          title: Cites
          description: result_ids backing every number in the text.
      additionalProperties: false
      type: object
      required:
      - text
      - cites
      title: RationaleItem
    SafetySheet:
      properties:
        sheet_id:
          type: string
          title: Sheet Id
        version:
          type: integer
          title: Version
        plan_id:
