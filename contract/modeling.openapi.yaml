          - push
          - pull
          - standby
          title: Mode
        force_lbf:
          type: number
          minimum: 0.0
          title: Force Lbf
        direction_true_deg:
          anyOf:
          - type: number
            exclusiveMaximum: 360.0
            minimum: 0.0
          - type: 'null'
          title: Direction True Deg
      additionalProperties: false
      type: object
      required:
      - tug_id
      - push_point_id
      - mode
      - force_lbf
      title: TugAssignment
    TugCommand:
      properties:
        t_s:
          type: number
          minimum: 0.0
          title: T S
        tug_id:
          type: string
          title: Tug Id
        force_lbf:
          type: number
          minimum: 0.0
          title: Force Lbf
        direction_rel_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Direction Rel Deg
          description: Direction the tug pushes the ship, relative to the bow (90 = toward starboard).
      additionalProperties: false
      type: object
      required:
      - t_s
      - tug_id
      - force_lbf
      - direction_rel_deg
      title: TugCommand
    TugPlanResponse:
      properties:
        result_id:
          type: string
          title: Result Id
          description: Stable id; the agent and safety sheet cite numbers by this id.
        model:
          type: string
          title: Model
          description: Module that produced the result, e.g. 'mooring.solver.static'.
        model_version:
          type: string
          title: Model Version
        backend:
          type: string
          enum:
          - mock
          - real
          title: Backend
          description: '''mock'' until the workstream''s real module lands.'
        inputs_hash:
          type: string
          title: Inputs Hash
          description: sha256 of the canonical request JSON.
        computed_at_utc:
          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          description: Absent on legacy responses and means UNKNOWN, never valid. New real paths always populate it. 'invalid'
            requires status RED; 'limited' cannot be GREEN.
        manifest:
          anyOf:
          - $ref: '#/components/schemas/ResultManifest'
          - type: 'null'
          description: Dependencies for reproducing the result; absent on legacy responses.
        result:
          $ref: '#/components/schemas/TugPlanResult'
      additionalProperties: false
      type: object
      required:
      - result_id
      - model
      - model_version
      - backend
      - inputs_hash
      - computed_at_utc
      - status
      - result
      title: TugPlanResponse
    TugPlanResult:
      properties:
        required_lateral_lbf:
          type: number
          title: Required Lateral Lbf
        required_by_point:
          items:
            $ref: '#/components/schemas/PushPointForce'
          type: array
          title: Required By Point
        assignments:
          items:
            $ref: '#/components/schemas/TugAssignment'
          type: array
          title: Assignments
        total_bollard_pull_lbf:
          type: number
          title: Total Bollard Pull Lbf
        total_power_hp:
          type: number
          title: Total Power Hp
        recommended_tug_count:
          type: integer
          title: Recommended Tug Count
        feasible:
          type: boolean
          title: Feasible
        rationale:
          items:
            type: string
          type: array
          title: Rationale
      additionalProperties: false
      type: object
      required:
      - required_lateral_lbf
      - required_by_point
      - assignments
      - total_bollard_pull_lbf
      - total_power_hp
      - recommended_tug_count
      - feasible
      - rationale
      title: TugPlanResult
    TugSpec:
      properties:
        tug_id:
          type: string
          title: Tug Id
          examples:
          - T1
        name:
          type: string
          title: Name
        propulsion:
          type: string
          enum:
          - conventional
          - asd
          - tractor
          - vsp
          title: Propulsion
        power_hp:
          type: number
          exclusiveMinimum: 0.0
          title: Power Hp
        bollard_pull_ahead_lbf:
          type: number
          exclusiveMinimum: 0.0
          title: Bollard Pull Ahead Lbf
        bollard_pull_astern_lbf:
          type: number
          exclusiveMinimum: 0.0
          title: Bollard Pull Astern Lbf
        provenance:
          $ref: '#/components/schemas/Provenance'
      additionalProperties: false
      type: object
      required:
      - tug_id
      - name
      - propulsion
      - power_hp
      - bollard_pull_ahead_lbf
      - bollard_pull_astern_lbf
      - provenance
      title: TugSpec
    TugState:
      properties:
        tug_id:
          type: string
          title: Tug Id
        force_lbf:
          type: number
          title: Force Lbf
        direction_rel_deg:
          type: number
          title: Direction Rel Deg
      additionalProperties: false
      type: object
      required:
      - tug_id
      - force_lbf
      - direction_rel_deg
      title: TugState
    UkcLeg:
      properties:
        leg_name:
          type: string
          title: Leg Name
        min_ukc_ft:
          type: number
          title: Min Ukc Ft
        squat_ft:
          type: number
          title: Squat Ft
        water_level_ft:
          type: number
          title: Water Level Ft
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
      additionalProperties: false
      type: object
      required:
      - leg_name
      - min_ukc_ft
      - squat_ft
      - water_level_ft
      - status
      title: UkcLeg
    UkcRequest:
      properties:
        ship_class_id:
          type: string
          title: Ship Class Id
        loading:
          type: string
          title: Loading
          default: full_load
        waypoints:
          items:
            $ref: '#/components/schemas/Waypoint'
          type: array
          title: Waypoints
        eta_utc:
          type: string
          format: date-time
          title: Eta Utc
          description: Time at the first waypoint.
        speed_profile_kt:
          items:
            type: number
          type: array
          title: Speed Profile Kt
          description: Speed on each leg (len = waypoints - 1).
      additionalProperties: false
      type: object
      required:
      - ship_class_id
      - waypoints
      - eta_utc
      - speed_profile_kt
      title: UkcRequest
    UkcResponse:
      properties:
        result_id:
          type: string
          title: Result Id
          description: Stable id; the agent and safety sheet cite numbers by this id.
        model:
          type: string
          title: Model
          description: Module that produced the result, e.g. 'mooring.solver.static'.
        model_version:
          type: string
          title: Model Version
        backend:
          type: string
          enum:
          - mock
          - real
          title: Backend
          description: '''mock'' until the workstream''s real module lands.'
        inputs_hash:
          type: string
          title: Inputs Hash
          description: sha256 of the canonical request JSON.
        computed_at_utc:
          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          description: Absent on legacy responses and means UNKNOWN, never valid. New real paths always populate it. 'invalid'
            requires status RED; 'limited' cannot be GREEN.
        manifest:
          anyOf:
          - $ref: '#/components/schemas/ResultManifest'
          - type: 'null'
          description: Dependencies for reproducing the result; absent on legacy responses.
        result:
          $ref: '#/components/schemas/UkcResult'
      additionalProperties: false
      type: object
      required:
      - result_id
      - model
      - model_version
      - backend
      - inputs_hash
      - computed_at_utc
      - status
      - result
      title: UkcResponse
    UkcResult:
      properties:
        legs:
          items:
            $ref: '#/components/schemas/UkcLeg'
          type: array
          title: Legs
        window:
          $ref: '#/components/schemas/TimeWindow'
      additionalProperties: false
      type: object
      required:
      - legs
      - window
      title: UkcResult
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Validity:
      properties:
        state:
          type: string
          enum:
          - valid
          - limited
          - invalid
          - unknown
          title: State
        reasons:
          items:
            $ref: '#/components/schemas/ValidityReason'
          type: array
          title: Reasons
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/SolverDiagnostics'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - state
      title: Validity
      description: 'Whether the numbers can be relied on, independent of the GREEN/AMBER/RED status.


        `valid`: inside the model''s qualified domain. `limited`: usable with the stated caveats, so never an

        unconditional GREEN. `invalid`: do not use the numbers; status is RED. `unknown`: not assessed.

        A numerical failure is not proof that no physical solution exists: report it as `invalid` with a reason.'
    ValidityReason:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          title: Code
          examples:
          - MISSING_FITTING_RATING
        message:
          type: string
          title: Message
        affected_components:
          items:
            type: string
          type: array
          title: Affected Components
          description: Element ids the reason applies to, e.g. 'line-2', 'P12N-B16'.
          examples:
          - - line-2
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ValidityReason
      description: Why a result is limited or invalid. Codes are stable UPPER_SNAKE identifiers that clients may switch on.
    VersionInfo:
      properties:
        api_version:
          type: string
          title: Api Version
        modules:
          additionalProperties:
            type: string
          type: object
          title: Modules
          description: Module name -> 'mock' or the real module version.
      additionalProperties: false
      type: object
      required:
      - api_version
      - modules
      title: VersionInfo
    Waypoint:
      properties:
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
        leg_name:
          type: string
          title: Leg Name
        channel_depth_mllw_ft:
          type: number
          title: Channel Depth Mllw Ft
        width_ft:
          type: number
          title: Width Ft
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      - leg_name
      - channel_depth_mllw_ft
      - width_ft
      title: Waypoint
    Alert:
      additionalProperties: false
      description: Message on WS /ws/alerts.
      properties:
        alert_id:
          title: Alert Id
          type: string
        at_utc:
          format: date-time
          title: At Utc
          type: string
        severity:
          enum:
          - INFO
          - AMBER
          - RED
          title: Severity
          type: string
        element_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Element Id
        message:
          title: Message
          type: string
        env:
          $ref: '#/components/schemas/EnvironmentSnapshot'
        limit_wind_kt:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Limit Wind Kt
      required:
      - alert_id
      - at_utc
      - severity
      - element_id
      - message
      - env
      title: Alert
      type: object
    JobDoneEvent:
      additionalProperties: false
      description: SSE `done` event on /jobs/{job_id}/events. Fetch the result from status_url.
      properties:
        job_id:
          title: Job Id
          type: string
        state:
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: State
          type: string
      required:
      - job_id
      - state
      title: JobDoneEvent
      type: object
    JobProgressEvent:
      additionalProperties: false
      description: SSE `progress` event on /jobs/{job_id}/events.
      properties:
        job_id:
          title: Job Id
          type: string
        progress:
          title: Progress
          type: number
        message:
          title: Message
          type: string
      required:
      - job_id
      - progress
      - message
      title: JobProgressEvent
      type: object
    SimControlMessage:
      additionalProperties: false
      properties:
        type:
          enum:
          - pause
          - resume
          - reset
          title: Type
          type: string
      required:
      - type
      title: SimControlMessage
      type: object
    SimLineEventMessage:
      additionalProperties: false
      properties:
        type:
          const: line_event
          title: Type
          type: string
        line_number:
          title: Line Number
          type: integer
        event:
          enum:
          - secured
          - tensioned
          - released
          title: Event
          type: string
      required:
      - type
      - line_number
      - event
      title: SimLineEventMessage
      type: object
    SimTugCommandMessage:
      additionalProperties: false
      description: Client message on WS /ws/sim/{session_id}.
      properties:
        type:
          const: tug_command
          title: Type
          type: string
        tug_id:
          title: Tug Id
          type: string
        force_lbf:
          minimum: 0
          title: Force Lbf
          type: number
        direction_rel_deg:
          exclusiveMaximum: 360
          minimum: 0
          title: Direction Rel Deg
          type: number
      required:
      - type
      - tug_id
      - force_lbf
      - direction_rel_deg
      title: SimTugCommandMessage
      type: object
tags:
- name: M1 Environment
  description: Wind, current and water level from every source, normalized.
- name: M2 Reference data
  description: Ships, lines, berths, tugs and saved scenarios.
- name: M3 Environmental loads
  description: Wind and current forces (UFC 4-159-03 Chapter 4).
- name: M4 Static mooring
  description: Line and fitting loads, NSTM 582 checks, limiting wind, tide sweep.
- name: M5 Risk
  description: Gust exceedance probability and forecast timeline.
- name: M6 Tugs
  description: Tug force, bollard pull and horsepower; berthing windows.
- name: M7 Planning
  description: Recommended line configuration and line sequence.
- name: M11 Berthing simulator
  description: 'Phase 2: time-domain berthing, batch and interactive.'
- name: M12 Approach
  description: 'Phase 3: route, under-keel clearance, approach simulation.'
- name: M13 Telemetry
  description: Ship sensor ingest for deployment.
- name: System
  description: Jobs, stored results, health.
servers:
- url: http://localhost:8000
  description: Local mock server
x-websockets:
  /ws/env:
    query: berth_id, mode=live|replay|scenario, env_scenario_id, replay_start_utc, speed, interval_s, limit
    server_messages: EnvironmentSnapshot
  /ws/alerts:
    query: berth_id, scenario_id, interval_s, limit
    server_messages: Alert
  /ws/sim/{session_id}:
    query: limit
    client_messages: SimTugCommandMessage | SimLineEventMessage | SimControlMessage
    server_messages: SimFrame (10 Hz)
  /ws/telemetry:
    client_messages: TelemetryRecord
    server_messages: TelemetryAccepted
