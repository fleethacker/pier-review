        current_bin:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Bin
          description: Instrument bin or model layer id.
        vertical_datum:
          anyOf:
          - type: string
            enum:
            - MLLW
            - MSL
            - NAVD88
            - other
          - type: 'null'
          title: Vertical Datum
          description: Datum of water_level_mllw_ft. Its name says MLLW; any other value is a conflict.
        quality:
          type: string
          enum:
          - good
          - suspect
          - poor
          - unknown
          title: Quality
          default: unknown
        age_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
