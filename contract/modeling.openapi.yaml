        amount_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Amount Ft
      additionalProperties: false
      type: object
      required:
      - at_utc
      - line_number
      - action
      - amount_ft
      title: TendingInput
      description: An explicit tending action applied to a line's installed rest length from `at_utc` onward.
