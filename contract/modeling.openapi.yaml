    LoadsResponse:
      properties:
        result_id:
          type: string
          title: Result Id
          description: Stable id; the agent and safety sheet cite numbers by this id.
        model:
          type: string
          title: Model
          description: Module that produced the result, e.g. 'mooring.solver.static'.
        model_version:
          type: string
          title: Model Version
        backend:
          type: string
          enum:
          - mock
          - real
          title: Backend
          description: '''mock'' until the workstream''s real module lands.'
        inputs_hash:
          type: string
          title: Inputs Hash
          description: sha256 of the canonical request JSON.
        computed_at_utc:
          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          description: Omitted when unset; absence means UNKNOWN, never valid. New real paths always populate it. 'invalid'
            requires status RED; 'limited' cannot be GREEN.
        manifest:
          anyOf:
          - $ref: '#/components/schemas/ResultManifest'
          - type: 'null'
          description: Dependencies for reproducing the result; omitted when unset to preserve legacy response shapes.
        result:
          $ref: '#/components/schemas/LoadsResult'
      additionalProperties: false
      type: object
      required:
      - result_id
      - model
      - model_version
      - backend
      - inputs_hash
      - computed_at_utc
      - status
      - result
      title: LoadsResponse
