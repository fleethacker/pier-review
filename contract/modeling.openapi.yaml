      tags:
      - M3 Environmental loads
      summary: Wind and current forces on the ship
      operationId: environmental_api_v1_loads_environmental_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadsRequest'
            examples:
              default:
                summary: DDG 51 at mock Pier 12 North
                value:
                  ship_class_id: DDG-51-FIIA
                  loading: full_load
                  heading_true_deg: 105.0
                  water_depth_ft: 46.8
                  environment:
                    valid_at_utc: '2026-11-04T15:48:00Z'
                    source: scenario
                    wind_speed_kt: 22.0
                    wind_gust_kt: 30.0
                    wind_from_true_deg: 200.0
                    current_speed_kt: 0.6
                    current_set_true_deg: 10.0
                    water_level_mllw_ft: 1.8
                    tide_stage: ebb
                    air_density_kgm3: 1.225
                    water_density_kgm3: 1020.0
