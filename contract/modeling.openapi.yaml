openapi: 3.1.0
info:
  title: 'Mooring Assistant: Modeling API'
  description: '

    Physics and ML modeling service for the mooring assistant. **Most modules still run on mock backends.**

    Environmental loads (M3, UFC 4-159-03) and reference data are real; `GET /version` lists each module''s status.

    Check `backend` in every response envelope; the `X-Mooring-Backend` header is `mixed` while some modules are mock.


    Conventions: unit-suffixed field names (`_kt`, `_ft`, `_lbf`, `_deg`, `_utc`); wind direction is where it blows

    FROM, current direction is where it flows TOWARD; long-running endpoints return `202` with a job (poll

    `/jobs/{job_id}` or stream `/jobs/{job_id}/events`). WebSocket channels are listed under `x-websockets`.

    '
  version: 1.0.0
paths:
  /api/v1/env/now:
    get:
      tags:
      - M1 Environment
      summary: Current environment at a berth
      operationId: env_now_api_v1_env_now_get
      parameters:
      - name: berth_id
        in: query
        required: true
        schema:
          type: string
          title: Berth Id
      - name: heading_true_deg
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
            exclusiveMaximum: 360
          - type: 'null'
          description: Adds relative bearings.
          title: Heading True Deg
        description: Adds relative bearings.
      - name: env_scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Serve a synthetic scenario instead.
          title: Env Scenario Id
        description: Serve a synthetic scenario instead.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/env/forecast:
    get:
      tags:
      - M1 Environment
      summary: Forecast series at a berth
      operationId: env_forecast_api_v1_env_forecast_get
      parameters:
      - name: berth_id
        in: query
        required: true
        schema:
          type: string
          title: Berth Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 120
          minimum: 1
          default: 48
          title: Hours
      - name: step_min
        in: query
        required: false
        schema:
          type: integer
          maximum: 180
          minimum: 6
          default: 30
          title: Step Min
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
