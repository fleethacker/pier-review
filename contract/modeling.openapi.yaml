          - replay
          - forecast
          - scenario
          - ship_sensor
          - mock
          title: Source
          default: scenario
        wind_speed_kt:
          type: number
          minimum: 0.0
          title: Wind Speed Kt
          description: Sustained wind, 10 m height, 1-minute average.
        wind_gust_kt:
          type: number
          minimum: 0.0
          title: Wind Gust Kt
        wind_from_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Wind From True Deg
          description: Direction the wind blows FROM.
        current_speed_kt:
          type: number
          minimum: 0.0
          title: Current Speed Kt
        current_set_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Current Set True Deg
          description: Direction the current flows TOWARD.
        water_level_mllw_ft:
          type: number
          title: Water Level Mllw Ft
        tide_stage:
          anyOf:
          - type: string
            enum:
            - flood
            - ebb
            - slack
          - type: 'null'
          title: Tide Stage
        air_density_kgm3:
          type: number
          exclusiveMinimum: 0.0
          title: Air Density Kgm3
          default: 1.225
        water_density_kgm3:
          type: number
          exclusiveMinimum: 0.0
          title: Water Density Kgm3
          description: Brackish Chesapeake default.
          default: 1020.0
        wind_rel_ship_deg:
          anyOf:
          - type: number
          - type: 'null'
          title: Wind Rel Ship Deg
          description: Relative bearing the wind comes from (0 = bow, 90 = starboard beam).
        current_rel_ship_deg:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Rel Ship Deg
          description: Relative bearing the current flows toward (0 = bow, 90 = starboard beam).
        quality:
          items:
            $ref: '#/components/schemas/StationQuality'
          type: array
          title: Quality
        metadata:
          anyOf:
          - $ref: '#/components/schemas/EnvironmentMetadata'
          - type: 'null'
          description: Basis, timing, averaging and datum. Absent means undocumented (legacy).
      additionalProperties: false
      type: object
      required:
      - wind_speed_kt
      - wind_gust_kt
      - wind_from_true_deg
      - current_speed_kt
      - current_set_true_deg
      - water_level_mllw_ft
      title: EnvironmentSnapshot
      description: Wind, current and water level at one time. Wind is normalized to a 10 m, 1-minute sustained speed.
    ExceedanceRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
          description: Informational; inputs are always taken from the body.
        ship_class_id:
          type: string
          title: Ship Class Id
          examples:
          - DDG-51-FIIA
        loading:
          type: string
          title: Loading
          default: full_load
        berth_id:
          type: string
          title: Berth Id
          examples:
          - NAVSTA-NORFOLK-P12-N
        config:
          $ref: '#/components/schemas/MooringConfig'
        environment:
          $ref: '#/components/schemas/EnvironmentSnapshot'
        tugs:
          items:
            $ref: '#/components/schemas/TugAssignment'
          type: array
          title: Tugs
        mst:
          type: string
          enum:
          - I
          - II
          - IIA
          - III
          title: Mst
          description: 'Sets the design factor: 3.0 (I, II, IIA) or 2.5 (III).'
          default: II
        lines_wet:
          type: boolean
          title: Lines Wet
          description: Apply the wet-strength factor (nylon loses 15%).
          default: true
        installed_at_water_level_mllw_ft:
          anyOf:
          - type: number
          - type: 'null'
          title: Installed At Water Level Mllw Ft
          description: Water level when the lines were installed and pretensioned. Defaults to environment.water_level_mllw_ft
            (lines installed at the analysis water level). A different value keeps rest lengths from that state.
        horizon_hours:
          type: number
          maximum: 72.0
          exclusiveMinimum: 0.0
          title: Horizon Hours
          default: 6
        n_samples:
          type: integer
          maximum: 20000.0
          minimum: 10.0
          title: N Samples
          default: 2000
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        gust_dynamic_factor:
          type: number
          maximum: 2.0
          minimum: 1.0
          title: Gust Dynamic Factor
          description: Force multiplier on the wind force, applied exactly once (the wind speed is scaled by its square root).
            It does not touch current, and it is not a validated dynamic model.
          default: 1.0
        uncertainty_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Uncertainty Model Id
          description: Defaults to the synthetic demonstration model (unqualified).
        include_horizon:
          type: boolean
          title: Include Horizon
          description: Also simulate time-correlated trajectories over horizon_hours.
          default: false
        n_trajectories:
          type: integer
          maximum: 2000.0
          minimum: 10.0
          title: N Trajectories
          default: 200
        horizon_step_min:
          type: integer
          maximum: 180.0
          minimum: 6.0
          title: Horizon Step Min
          default: 30
      additionalProperties: false
      type: object
      required:
      - ship_class_id
      - berth_id
      - config
      - environment
      title: ExceedanceRequest
      description: At most 25,000 combined baseline, instantaneous and trajectory equilibrium solves per job.
