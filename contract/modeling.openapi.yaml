      - msg
      - type
      title: ValidationError
    Validity:
      properties:
        state:
          type: string
          enum:
          - valid
          - limited
          - invalid
          - unknown
          title: State
        reasons:
          items:
            $ref: '#/components/schemas/ValidityReason'
          type: array
          title: Reasons
        diagnostics:
          anyOf:
          - $ref: '#/components/schemas/SolverDiagnostics'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - state
      title: Validity
      description: 'Whether the numbers can be relied on, independent of the GREEN/AMBER/RED status.


        `valid`: inside the model''s qualified domain. `limited`: usable with the stated caveats, so never an

        unconditional GREEN. `invalid`: do not use the numbers; status is RED. `unknown`: not assessed.

        A numerical failure is not proof that no physical solution exists: report it as `invalid` with a reason.'
    ValidityReason:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          title: Code
          examples:
          - MISSING_FITTING_RATING
        message:
          type: string
          title: Message
        affected_components:
          items:
            type: string
          type: array
          title: Affected Components
          description: Element ids the reason applies to, e.g. 'line-2', 'P12N-B16'.
          examples:
          - - line-2
      additionalProperties: false
      type: object
      required:
      - code
