            and water level when this is supplied.
        basis:
          type: string
          enum:
          - observation
          - prediction
          - scenario
          title: Basis
          description: Measured, forecast/model output, or synthetic what-if input.
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Provider or station, e.g. 'NOAA CO-OPS 8638610'.
