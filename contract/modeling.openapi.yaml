        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DockingDemoCase'
                type: array
                title: Response Demo Docking Cases Api V1 Demo Docking Cases Get
  /api/v1/data-simulation/forecast:
    post:
      tags:
      - M2 Reference data
      summary: Generate labeled, seeded training conditions; not a weather forecast
      operationId: synthetic_forecast_api_v1_data_simulation_forecast_post
