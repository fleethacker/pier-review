openapi: 3.1.0
info:
  title: 'Mooring Assistant: Modeling API'
  description: '

    Physics and planning service for the mooring assistant. `GET /version` reports implementation status;

    `GET /capabilities` reports scope and qualification blockers. A `real` backend is not operational certification.

    Inspect each result''s validity, reasons and source provenance: seed assets, synthetic forcing and unqualified

    models remain limited or invalid. The offline default environment is synthetic; public providers are opt-in.


    Conventions: unit-suffixed field names (`_kt`, `_ft`, `_lbf`, `_deg`, `_utc`); wind direction is where it blows

    FROM, current direction is where it flows TOWARD; long-running endpoints return `202` with a job (poll

    `/jobs/{job_id}` or stream `/jobs/{job_id}/events`). WebSocket channels are listed under `x-websockets`.

    '
  version: 1.0.0
paths:
  /api/v1/env/now:
    get:
      tags:
      - M1 Environment
      summary: Current environment at a berth
      operationId: env_now_api_v1_env_now_get
      parameters:
      - name: berth_id
        in: query
        required: true
        schema:
          type: string
          title: Berth Id
      - name: heading_true_deg
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
            exclusiveMaximum: 360
          - type: 'null'
          description: Adds relative bearings.
          title: Heading True Deg
        description: Adds relative bearings.
      - name: env_scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Serve a synthetic scenario instead.
          title: Env Scenario Id
        description: Serve a synthetic scenario instead.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/env/forecast:
    get:
      tags:
      - M1 Environment
      summary: Forecast series at a berth
      operationId: env_forecast_api_v1_env_forecast_get
      parameters:
      - name: berth_id
        in: query
        required: true
        schema:
          type: string
          title: Berth Id
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 120
          minimum: 1
          default: 48
          title: Hours
      - name: step_min
        in: query
        required: false
        schema:
          type: integer
          maximum: 180
          minimum: 6
          default: 30
          title: Step Min
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/env/history:
    get:
      tags:
      - M1 Environment
      summary: Historical observations for replay
      operationId: env_history_api_v1_env_history_get
      parameters:
      - name: station
        in: query
        required: true
        schema:
          type: string
          title: Station
      - name: start_utc
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start Utc
      - name: end_utc
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End Utc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/env/scenarios:
    post:
      tags:
      - M1 Environment
      summary: Create a synthetic environment
      operationId: env_scenario_create_api_v1_env_scenarios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvScenarioCreate'
            examples:
              default:
                summary: DDG 51 at mock Pier 12 North
                value:
                  name: MST II design condition
                  kind: steady
                  wind_speed_kt: 64
                  wind_gust_kt: 64
                  wind_from_true_deg: 195
                  current_speed_kt: 2.0
                  current_set_true_deg: 15
                  water_level_mllw_ft: 0.0
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvScenario'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/env/scenarios/{env_scenario_id}:
    get:
      tags:
      - M1 Environment
      summary: Env Scenario Get
      operationId: env_scenario_get_api_v1_env_scenarios__env_scenario_id__get
      parameters:
      - name: env_scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Env Scenario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvScenario'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
