                  config:
                    side_to: starboard
                    ship_x_ft: 650.0
                    lines:
                    - line_number: 1
                      role: bow
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-1S
                      pier_fitting_id: P12N-B17
                    - line_number: 2
                      role: spring_aft
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-2S
                      pier_fitting_id: P12N-B12
                    - line_number: 3
                      role: breast
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-3S
                      pier_fitting_id: P12N-M06
                    - line_number: 4
                      role: breast
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-4S
                      pier_fitting_id: P12N-M05
                    - line_number: 5
                      role: spring_fwd
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-5S
                      pier_fitting_id: P12N-B10
                    - line_number: 6
                      role: stern
                      spec_id: NYLON-DB-7IN
                      parts: 1
                      ship_fitting_id: BITT-6S
                      pier_fitting_id: P12N-B06
        required: true
      responses:
        '201':
          description: Successful Response
          content:
