          default: true
        forecast_hours:
          type: integer
          maximum: 120.0
          minimum: 1.0
          title: Forecast Hours
          default: 48
        step_min:
          type: integer
          maximum: 180.0
          minimum: 6.0
          title: Step Min
          default: 30
      additionalProperties: false
      type: object
      required:
      - ship_class_id
      - berth_id
      - config
      - environment
      title: TimelineRequest
    TrackPoint:
      properties:
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
        t_s:
          type: number
          title: T S
        heading_true_deg:
          type: number
          title: Heading True Deg
        speed_kt:
          type: number
          title: Speed Kt
        cross_track_ft:
          type: number
          title: Cross Track Ft
        ukc_ft:
          type: number
          title: Ukc Ft
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      - t_s
      - heading_true_deg
      - speed_kt
      - cross_track_ft
      - ukc_ft
      title: TrackPoint
    TugAssignment:
      properties:
        tug_id:
          type: string
          title: Tug Id
        push_point_id:
          type: string
          title: Push Point Id
        mode:
