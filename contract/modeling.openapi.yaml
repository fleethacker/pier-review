          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          description: Omitted when unset; absence means UNKNOWN, never valid. New real paths always populate it. 'invalid'
