    TideSweepRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
          description: Informational; inputs are always taken from the body.
        ship_class_id:
          type: string
          title: Ship Class Id
          examples:
          - DDG-51-FIIA
        loading:
          type: string
          title: Loading
          default: full_load
        berth_id:
          type: string
          title: Berth Id
          examples:
          - NAVSTA-NORFOLK-P12-N
        config:
          $ref: '#/components/schemas/MooringConfig'
        environment:
          $ref: '#/components/schemas/EnvironmentSnapshot'
        tugs:
          items:
            $ref: '#/components/schemas/TugAssignment'
          type: array
          title: Tugs
        mst:
          type: string
          enum:
          - I
          - II
          - IIA
          - III
          title: Mst
          description: 'Sets the design factor: 3.0 (I, II, IIA) or 2.5 (III).'
          default: II
        lines_wet:
          type: boolean
          title: Lines Wet
          description: Apply the wet-strength factor (nylon loses 15%).
          default: true
        installed_at_water_level_mllw_ft:
          anyOf:
          - type: number
          - type: 'null'
          title: Installed At Water Level Mllw Ft
          description: Water level when the lines were installed and pretensioned. Defaults to environment.water_level_mllw_ft
            (lines installed at the analysis water level). A different value keeps rest lengths from that state.
        from_utc:
          type: string
          format: date-time
          title: From Utc
        to_utc:
          type: string
          format: date-time
          title: To Utc
        step_min:
          type: integer
          maximum: 180.0
          minimum: 5.0
          title: Step Min
          default: 30
        tending:
          items:
            $ref: '#/components/schemas/TendingInput'
          type: array
          title: Tending
          description: Explicit tending applied in time order. Nothing is retensioned silently.
        water_level_forecast:
          anyOf:
          - items:
              $ref: '#/components/schemas/EnvironmentSnapshot'
            type: array
            maxItems: 2000
            minItems: 2
          - type: 'null'
          title: Water Level Forecast
          description: Optional supplied snapshots covering the whole sweep; only MLLW water levels vary. Linear interpolation
            is explicitly limited. Absent uses a labeled synthetic training tide.
      additionalProperties: false
      type: object
      required:
      - ship_class_id
      - berth_id
      - config
      - environment
      - from_utc
      - to_utc
      title: TideSweepRequest
    TideSweepResponse:
      properties:
        result_id:
          type: string
          title: Result Id
          description: Stable id; the agent and safety sheet cite numbers by this id.
        model:
          type: string
          title: Model
          description: Module that produced the result, e.g. 'mooring.solver.static'.
        model_version:
          type: string
          title: Model Version
        backend:
          type: string
          enum:
          - mock
          - real
          title: Backend
          description: '''mock'' until the workstream''s real module lands.'
        inputs_hash:
          type: string
          title: Inputs Hash
          description: sha256 of the canonical request JSON.
        computed_at_utc:
          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
          - GREEN
          - AMBER
          - RED
          title: Status
        assumptions:
          items:
            type: string
          type: array
          title: Assumptions
        warnings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Warnings
        validity:
          anyOf:
          - $ref: '#/components/schemas/Validity'
          - type: 'null'
          description: Omitted when unset; absence means UNKNOWN, never valid. New real paths always populate it. 'invalid'
            requires status RED; 'limited' cannot be GREEN.
        manifest:
          anyOf:
          - $ref: '#/components/schemas/ResultManifest'
          - type: 'null'
          description: Dependencies for reproducing the result; omitted when unset to preserve legacy response shapes.
        result:
          $ref: '#/components/schemas/TideSweepResult'
      additionalProperties: false
      type: object
      required:
      - result_id
      - model
      - model_version
      - backend
      - inputs_hash
      - computed_at_utc
      - status
      - result
      title: TideSweepResponse
    TideSweepResult:
      properties:
        steps:
          items:
            $ref: '#/components/schemas/TideStep'
          type: array
          title: Steps
        tending:
          items:
            $ref: '#/components/schemas/TendingAction'
          type: array
          title: Tending
          description: Recommended actions (not applied) to restore each line's installed tension, at time_resolution_min
            resolution.
        time_resolution_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Time Resolution Min
          description: Internal evaluation interval; extremes between reported steps are captured at this resolution.
        line_extremes:
          anyOf:
          - items:
              $ref: '#/components/schemas/LineExtreme'
            type: array
          - type: 'null'
          title: Line Extremes
        applied_tending:
          anyOf:
          - items:
              $ref: '#/components/schemas/TendingAction'
            type: array
          - type: 'null'
          title: Applied Tending
          description: The explicit tending inputs that were applied.
      additionalProperties: false
      type: object
      required:
      - steps
      - tending
      title: TideSweepResult
