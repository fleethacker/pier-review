        heading_true_deg:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Heading True Deg
        water_depth_ft:
          type: number
          exclusiveMinimum: 0.0
          title: Water Depth Ft
          description: Water depth at the ship; with draft it sets the current coefficient.
        environment:
          $ref: '#/components/schemas/EnvironmentSnapshot'
        use_gust:
          type: boolean
          title: Use Gust
          default: true
        shielding_factor:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Shielding Factor
          description: Reduction for pier buildings or ships upwind.
          default: 1.0
        side_to:
          anyOf:
          - type: string
            enum:
            - port
            - starboard
          - type: 'null'
          title: Side To
          description: When given, off_pier_component_lbf is returned.
        require_verified_wind_basis:
          type: boolean
          title: Require Verified Wind Basis
          description: When true, a snapshot without documented wind averaging/gust duration and height makes the result 'limited'
            (WIND_BASIS_UNVERIFIED) instead of silently using the legacy assumption.
