    post:
      tags:
      - M2 Reference data
      summary: Register an immutable berth; identical retries are accepted, changed data requires a new ID
      operationId: create_berth_api_v1_berths_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Berth'
        required: true
      responses:
