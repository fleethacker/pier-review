          title: T Utc
        sentence:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentence
          description: Raw NMEA 0183 sentence, e.g. '$WIMWV,...'.
        line_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Line Number
          description: 'load_cell: which mooring line.'
        tension_lbf:
          anyOf:
          - type: number
          - type: 'null'
          title: Tension Lbf
        mmsi:
          anyOf:
          - type: string
          - type: 'null'
          title: Mmsi
          description: 'ais: vessel id (tugs).'
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
          - type: 'null'
          title: Lon
        sensor_id:
          anyOf:
          - type: string
          - type: 'null'
