components:
  schemas:
    AnalyzeRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
          description: Informational; inputs are always taken from the body.
        ship_class_id:
          type: string
          title: Ship Class Id
          examples:
          - DDG-51-FIIA
        loading:
          type: string
          title: Loading
          default: full_load
        berth_id:
          type: string
          title: Berth Id
          examples:
          - NAVSTA-NORFOLK-P12-N
        config:
          $ref: '#/components/schemas/MooringConfig'
        environment:
          $ref: '#/components/schemas/EnvironmentSnapshot'
        tugs:
          items:
            $ref: '#/components/schemas/TugAssignment'
          type: array
          title: Tugs
        mst:
          type: string
          enum:
          - I
          - II
          - IIA
          - III
          title: Mst
          description: 'Sets the design factor: 3.0 (I, II, IIA) or 2.5 (III).'
          default: II
        lines_wet:
          type: boolean
          title: Lines Wet
          description: Apply the wet-strength factor (nylon loses 15%).
          default: true
        installed_at_water_level_mllw_ft:
          anyOf:
          - type: number
          - type: 'null'
          title: Installed At Water Level Mllw Ft
          description: Water level when the lines were installed and pretensioned. Defaults to environment.water_level_mllw_ft
            (lines installed at the analysis water level). A different value keeps rest lengths from that state.
      additionalProperties: false
      type: object
      required:
      - ship_class_id
      - berth_id
      - config
      - environment
      title: AnalyzeRequest
    AnalyzeResponse:
      properties:
        result_id:
          type: string
          title: Result Id
          description: Stable id; the agent and safety sheet cite numbers by this id.
        model:
          type: string
          title: Model
          description: Module that produced the result, e.g. 'mooring.solver.static'.
        model_version:
          type: string
          title: Model Version
        backend:
          type: string
          enum:
          - mock
          - real
          title: Backend
          description: '''mock'' until the workstream''s real module lands.'
        inputs_hash:
          type: string
          title: Inputs Hash
          description: sha256 of the canonical request JSON.
        computed_at_utc:
          type: string
          format: date-time
          title: Computed At Utc
        status:
          type: string
          enum:
