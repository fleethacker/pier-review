        required: false
        schema:
          type: string
          default: '8638614'
          title: Station
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GustModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
