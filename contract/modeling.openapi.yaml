          description: 'load_cell: registered sensor/channel id (required in the validating ingest).'
        vessel_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vessel Id
          description: Vessel the sensor is installed on; must match the sensor registry.
        calibration_rev:
          anyOf:
          - type: string
          - type: 'null'
