tags:
- name: M1 Environment
  description: Wind, current and water level from every source, normalized.
- name: M2 Reference data
  description: Ships, lines, berths, tugs and saved scenarios.
- name: M3 Environmental loads
  description: Wind and current forces (UFC 4-159-03 Chapter 4).
- name: M4 Static mooring
  description: Line and fitting loads, NSTM 582 checks, limiting wind, tide sweep.
- name: M5 Risk
  description: Gust exceedance probability and forecast timeline.
- name: M6 Tugs
  description: Tug force, bollard pull and horsepower; berthing windows.
- name: M7 Planning
  description: Recommended line configuration and line sequence.
- name: M11 Berthing simulator
  description: 'Phase 2: time-domain berthing, batch and interactive.'
- name: M12 Approach
  description: 'Phase 3: route, under-keel clearance, approach simulation.'
- name: M13 Telemetry
  description: Ship sensor ingest for deployment.
- name: S5 Missions
  description: 'Mission storyboarding: recorded tracks with images and reports located by time.'
- name: S6 Port transit
  description: Ships entering or leaving port on own thrust or with tugs (surrogate maneuvering).
- name: System
  description: Jobs, stored results, health.
servers:
- url: http://localhost:8000
  description: Local mock server
x-websockets:
  /ws/env:
    query: berth_id, mode=live|replay|scenario, env_scenario_id, replay_start_utc, speed, interval_s, limit
    server_messages: EnvironmentSnapshot
  /ws/alerts:
    query: berth_id, scenario_id, interval_s, limit
    server_messages: Alert
    terminal_close_codes:
      '1013': Environment source unavailable; no replacement snapshot is emitted
      '4404': Scenario/source/reference not found or not owned
      '4400': Invalid interval, limit or reference
  /ws/sim/{session_id}:
    query: limit (counts all server messages), after_sequence (resend only newer retained lifecycle; the current frame is
      always sent on connect; a restating lifecycle is sent if history was evicted)
    client_messages: SimTugCommandMessage | SimLineEventMessage | SimControlMessage | SimSpeedMessage
    server_messages: SimLifecycle (type=session_lifecycle; reliable, retained) and SimFrame (rm0-v1, latest state only; sequence
      gaps are dropped display frames), interleaved in session-wide sequence order
    scene: GET /api/v1/berthing/sessions/{session_id}/scene
    recording: GET /api/v1/berthing/sessions/{session_id}/recording
  /ws/telemetry:
    client_messages: TelemetryRecord
    server_messages: TelemetryAccepted
x-motion-contract:
  schema_version: rm0-v1
  status: Interactive sessions (POST /berthing/sessions, WS /ws/sim) emit rm0-v1 frames, lifecycle, scene and recording from
    the live simulator (S1). Batch /berthing/simulate series remain legacy frames.
  models:
