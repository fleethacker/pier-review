      type: object
    HeldOutValidation:
      additionalProperties: false
      description: Calibration check on data not used for fitting.
      properties:
        n_heldout:
          minimum: 0
          title: N Heldout
          type: integer
        nominal_coverage:
          exclusiveMaximum: 1
          exclusiveMinimum: 0
          title: Nominal Coverage
          type: number
        observed_coverage:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Observed Coverage
      required:
      - n_heldout
      - nominal_coverage
      title: HeldOutValidation
      type: object
    HorizonRisk:
      additionalProperties: false
      description: Probability of the event over the horizon, from correlated trajectories (not a combination of pointwise
        values).
      properties:
        event:
          title: Event
          type: string
        n_trajectories:
          title: N Trajectories
          type: integer
        step_min:
          title: Step Min
          type: integer
        horizon_hours:
          title: Horizon Hours
          type: number
        p_event:
          description: Known exceedances / all trajectories; a lower bound when solves fail. Consult p_event_bounds.
          maximum: 1
          minimum: 0
          title: P Event
          type: number
        p_event_ci95:
          description: 95% Wilson interval widened over both possible outcomes of failed trajectories.
          items:
            type: number
          title: P Event Ci95
          type: array
        n_failed:
          title: N Failed
          type: integer
        correlation_time_min:
          title: Correlation Time Min
          type: number
        p_event_bounds:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          default: null
          description: '[known exceedances / n, (known exceedances + failed) / n]. Failed trajectories are unknown, never
            safe.'
          title: P Event Bounds
        effective_step_min:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Actual uniform sampling interval, no larger than step_min, including both horizon endpoints.
          title: Effective Step Min
      required:
      - event
      - n_trajectories
      - step_min
      - horizon_hours
      - p_event
      - p_event_ci95
      - n_failed
      - correlation_time_min
      title: HorizonRisk
      type: object
