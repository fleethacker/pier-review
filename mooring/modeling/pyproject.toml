[project]
name = "mooring-modeling"
version = "0.1.0"
description = "Mooring assistant physics and ML modeling service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fiona>=1.10",
    "shapely>=2.0",
    "xarray>=2025.1",
    "netCDF4>=1.7",
    "pillow>=10.4",  # S5 EXIF/image validation
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mooring", "modeling_api"]
